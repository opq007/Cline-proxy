version: "3.9"

services:
  cline-proxy:
    build: .
    container_name: cline-proxy
    restart: unless-stopped
    ports:
      - "3457:3457"
    volumes:
      - ./.cline-accounts.json:/app/.cline-accounts.json
      - ./override.md:/app/override.md:ro
    environment:
      - PORT=3457
      # 公网部署务必设置：管理后台访问令牌（也可用 CLINE_ADMIN_TOKEN）
      - ADMIN_TOKEN=${ADMIN_TOKEN:-}
